# Publishes the X-Ray family to nuget.org: X-Ray.Content (the native C# extraction engine under
# dotnet/, whose API lives in the XRay.Content namespace) and X-Ray (the umbrella metapackage
# that installs the family). Modelled on curiosity-ai/hnsw-sharp's .devops/build-nuget.yml:
# CalVer versioning off the build id, pack, then push through the shared service connection.
#
# The whole family ships in one run, from one version. That is what keeps the umbrella honest:
# its dependency on X-Ray.Content is written by `dotnet pack` from the version the referenced
# project was packed with, so publishing together pins it to this run with nothing to bump by
# hand. Publishing a member on its own would leave the umbrella pointing at the older version.
variables:
  # Every packable project, in dependency order. `projects` and `packagesToPack` both accept a
  # newline-separated list, and the tasks run once per entry.
  library: './dotnet/src/XRay.Content/XRay.Content.csproj'
  umbrella: './dotnet/src/XRay/XRay.csproj'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

# Only the C# port publishes this package. This is a polyglot monorepo that also carries the
# Rust engine and its bindings, so without the path filter every upstream merge would ship a
# new NuGet version that contains no C# change.
trigger:
  branches:
    include:
    - main
  paths:
    include:
    - dotnet/*
    - .devops/build-x-ray-nuget.yml

pool:
  vmImage: 'windows-latest'

steps:
- task: NuGetToolInstaller@0


- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"


- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)\dotnet

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: |
      $(library)
      $(umbrella)
  displayName: 'restore nuget'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: |
      $(library)
      $(umbrella)
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LangVersion=latest'
  displayName: 'build'

# No test step: the unit tests under dotnet/tests read fixtures from the `test_documents`
# submodule, whose binaries are not in git — they come from a ~580 MiB bucket fetch (see
# CLAUDE.md, "Re-syncing after an upstream merge"). Parity and corpus runs stay a local
# job; add a test stage here once the corpus is available to the agent.

- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    packagesToPack: |
      $(library)
      $(umbrella)
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: 'off'
    configuration: '$(buildConfiguration)'
    buildProperties: 'Version="$(targetVersion)";LangVersion="latest"'
    nobuild: true
  displayName: 'pack nuget'

# The push below picks up every .nupkg in the staging directory, so both packages go out in one
# step. NuGet accepts them in any order — a package may be published before a dependency it
# names, and the dependency only has to exist by the time a consumer restores.

- task: NuGetCommand@2
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
  displayName: 'push nuget'
